<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1188/1188519.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="askDiff">
        <h1>Typing Speed Test</h1>
        <label for="opt">Select Your Test</label>
        <select id="opt">
            <option value="" selected disabled>Select Options</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="difficult">Difficult</option>
        </select>
        <button id="btnTest">Start Test</button>
    </div>
    <div id="container" hidden>
        <div id="containPara">
            <p id="contentPara"></p>
        </div>

        <div id="stats">
            <span id="diff">Difficulty Level: </span>
            <span id="timer">60s</span>
            <span id="cpm">CPM: 0</span>
            <span id="wpm">WPM: 0</span>
            <span id="mistakes">Mistakes: 0</span>
            <button id="tryAgain">Try Again</button>
        </div>

        <input type="text" id="hiddenInput" autocomplete="off">
    </div>
    <script src="script.js"></script>
</body>
</html>
